<script>
(function(){
  const CATS = [
    {key:'food', icon:'🍽️', label:'餐飲'},
    {key:'life', icon:'🛒', label:'生活'},
    {key:'fun', icon:'🎬', label:'娛樂'},
    {key:'transport', icon:'🚗', label:'交通'},
    {key:'home', icon:'🏠', label:'居家'},
    {key:'other', icon:'✨', label:'其他'},
  ];
  const ledgerDocRef = window.__cplgLedgerRef;
  let state = null;      // {partners:{a:{name},b:{name}}, expenses:[], settlements:[]}
  let ui = {
    desc: '',
    amount: '',
    catKey: 'other',
    paidBy: 'a',
    splitMode: 'equal',  // 'equal' | 'custom'
    splitA: 50,
    modal: null,          // null | 'settings' | 'settle' | 'history'
  };
  let loaded = false;

  const fmt = n => new Intl.NumberFormat('zh-TW', {maximumFractionDigits: 0}).format(Math.round(n));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function defaultData(){
    return {
      partners: { a: { name: '阿翔' }, b: { name: '小美' } },
      expenses: [],
      settlements: []
    };
  }

  // Real-time listener: whenever either partner writes, both sides update automatically.
  function startListening(){
    ledgerDocRef.onSnapshot((snap) => {
      if (snap.exists) {
        state = snap.data();
      } else {
        state = defaultData();
        ledgerDocRef.set(state).catch(e => console.error('初始化帳本失敗', e));
      }
      loaded = true;
      render();
    }, (err) => {
      console.error('讀取帳本失敗', err);
      if (!loaded){
        state = defaultData();
        loaded = true;
        render();
      }
    });
  }

  async function saveData(){
    try {
      await ledgerDocRef.set(state);
    } catch (e) {
      console.error('儲存失敗', e);
    }
  }

  // "墊付" (advance): the payer fronted the money entirely for the other person —
  // the whole amount is owed back, it's not a shared 50/50 cost.
  function computeAdvanceSplitA(paidBy){
    return paidBy === 'a' ? 0 : 100; // A's own share of the expense
  }

  function advanceNoteHtml(nameA, nameB, paidBy){
    const payer = paidBy === 'a' ? nameA : nameB;
    const other = paidBy === 'a' ? nameB : nameA;
    return `<b>${escapeHtml(payer)}</b> 全額墊付，之後由 <b>${escapeHtml(other)}</b> 全部歸還，不算平分。`;
  }

  function computeBalance(){
    // positive => b owes a ; negative => a owes b
    let bal = 0;
    for (const ex of state.expenses){
      const shareA = ex.amount * (ex.splitA/100);
      const shareB = ex.amount - shareA;
      if (ex.paidBy === 'a') bal += shareB;
      else bal -= shareA;
    }
    for (const s of state.settlements){
      if (s.from === 'b') bal -= s.amount; // b paid a
      else bal += s.amount; // a paid b
    }
    return bal;
  }

  function groupByDay(expenses){
    const groups = {};
    const sorted = [...expenses].sort((x,y)=> y.date.localeCompare(x.date) || y.createdAt - x.createdAt);
    for (const ex of sorted){
      (groups[ex.date] = groups[ex.date] || []).push(ex);
    }
    return groups;
  }

  function formatDay(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((today - d)/86400000);
    const wk = ['日','一','二','三','四','五','六'][d.getDay()];
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    return `${d.getMonth()+1}月${d.getDate()}日 (週${wk})`;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- render ----------
  function render(){
    const app = document.getElementById('cl-app');
    if (!loaded){ return; }

    // remember focus / cursor / scroll so re-rendering doesn't feel like a page reload
    const active = document.activeElement;
    const activeId = active && active.id;
    const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
    const scrollY = window.scrollY;

    const nameA = state.partners.a.name;
    const nameB = state.partners.b.name;
    const bal = computeBalance();
    const total = state.expenses.reduce((s,e)=>s+e.amount,0);

    let verdictHtml, amountHtml;
    if (Math.abs(bal) < 1){
      verdictHtml = `目前收支平衡`;
      amountHtml = `<div class="cl-hero-amount settled">已結清 🎉</div>`;
    } else if (bal > 0){
      verdictHtml = `<span style="color:var(--accent-b)">${escapeHtml(nameB)}</span> 該付給 <span style="color:var(--accent-a)">${escapeHtml(nameA)}</span>`;
      amountHtml = `<div class="cl-hero-amount owe-a">NT$ ${fmt(bal)}</div>`;
    } else {
      verdictHtml = `<span style="color:var(--accent-a)">${escapeHtml(nameA)}</span> 該付給 <span style="color:var(--accent-b)">${escapeHtml(nameB)}</span>`;
      amountHtml = `<div class="cl-hero-amount owe-b">NT$ ${fmt(Math.abs(bal))}</div>`;
    }

    // tilt: positive bal => b owes => b(right) pan sinks => rotate beam clockwise-ish
    const angle = Math.max(-10, Math.min(10, bal === 0 ? 0 : (bal>0 ? 7 : -7)));

    const groups = groupByDay(state.expenses);
    const dayKeys = Object.keys(groups).sort((x,y)=> y.localeCompare(x));

    let listHtml;
    if (state.expenses.length === 0){
      listHtml = `
        <div class="cl-empty">
          <div class="cl-empty-icon">📖</div>
          <p>帳本還是空的，新增第一筆支出吧</p>
        </div>`;
    } else {
      listHtml = `<div class="cl-spine">` + dayKeys.map(day => {
        const items = groups[day];
        const rows = items.map(ex => {
          const cat = CATS.find(c=>c.key===ex.cat) || CATS[CATS.length-1];
          const payerName = ex.paidBy === 'a' ? nameA : nameB;
          const otherName = ex.paidBy === 'a' ? nameB : nameA;
          const payerColor = ex.paidBy === 'a' ? 'var(--accent-a)' : 'var(--accent-b)';
          const splitTxt = ex.mode === 'advance' ? `${escapeHtml(otherName)}需歸還全額` : '平分';
          return `
            <div class="cl-entry">
              <div class="cl-entry-icon">${cat.icon}</div>
              <div class="cl-entry-mid">
                <div class="cl-entry-desc">${escapeHtml(ex.desc) || cat.label}</div>
                <div class="cl-entry-meta">
                  <span class="cl-dot" style="background:${payerColor}"></span>
                  ${escapeHtml(payerName)}付款 · ${splitTxt}
                </div>
              </div>
              <div class="cl-entry-right">
                <div class="cl-entry-amount">NT$ ${fmt(ex.amount)}</div>
                <button class="cl-entry-del" onclick="clDeleteExpense('${ex.id}')">刪除</button>
              </div>
            </div>`;
        }).join('');
        return `<div class="cl-day-group"><div class="cl-day-label">${formatDay(day)}</div>${rows}</div>`;
      }).join('') + `</div>`;
    }

    const histCount = state.settlements.length;
    const historyHtml = histCount === 0 ? '' : `
      <div class="cl-history-toggle" onclick="clOpenModal('history')">查看結清紀錄 (${histCount})</div>`;

    app.innerHTML = `
      <div class="cl-header">
        <div class="cl-brand">
          <div class="cl-brand-mark">💞</div>
          <div>
            <h1>共同帳本</h1>
            <p>${escapeHtml(nameA)} &amp; ${escapeHtml(nameB)} 的 AA 分帳</p>
          </div>
        </div>
        <div class="cl-gear" onclick="clOpenModal('settings')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
      </div>

      <div class="cl-hero">
        <div class="cl-hero-content">
          <div class="cl-scale-wrap">
            <svg width="180" height="70" viewBox="0 0 180 70">
              <line x1="90" y1="34" x2="90" y2="62" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
              <polygon points="90,62 76,68 104,68" fill="var(--border)"/>
              <g class="cl-scale-beam" style="transform: rotate(${angle}deg)">
                <line x1="18" y1="14" x2="162" y2="14" stroke="var(--text-faint)" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="18" y1="14" x2="18" y2="30" stroke="var(--text-faint)" stroke-width="1.5"/>
                <line x1="162" y1="14" x2="162" y2="30" stroke="var(--text-faint)" stroke-width="1.5"/>
                <circle cx="18" cy="34" r="9" fill="var(--accent-a)"/>
                <circle cx="162" cy="34" r="9" fill="var(--accent-b)"/>
                <circle cx="90" cy="14" r="3.5" fill="var(--text-faint)"/>
              </g>
            </svg>
          </div>
          <div class="cl-hero-names">
            <span class="cl-name-chip"><span class="cl-dot" style="background:var(--accent-a)"></span>${escapeHtml(nameA)}</span>
            <span style="opacity:.4">·</span>
            <span class="cl-name-chip"><span class="cl-dot" style="background:var(--accent-b)"></span>${escapeHtml(nameB)}</span>
          </div>
          <div class="cl-hero-verdict">${verdictHtml}</div>
          ${amountHtml}
          <button class="cl-settle-btn" ${Math.abs(bal)<1 ? 'disabled' : ''} onclick="clOpenModal('settle')">一鍵結清</button>
        </div>
      </div>

      <div class="cl-add-card">
        <div class="cl-section-label" style="margin-bottom:14px;">新增支出</div>
        <div class="cl-field">
          <label>項目</label>
          <input class="cl-input" id="cl-desc" placeholder="例如：晚餐、電影票、加油" value="${escapeHtml(ui.desc)}" oninput="clSetDesc(this.value)" />
        </div>
        <div class="cl-row2">
          <div class="cl-field">
            <label>金額</label>
            <input class="cl-input cl-amount" id="cl-amount" type="number" inputmode="decimal" placeholder="0" value="${escapeHtml(ui.amount)}" oninput="clSetAmount(this.value)" />
          </div>
        </div>
        <div class="cl-field">
          <label>分類</label>
          <div class="cl-cat-row">
            ${CATS.map(c => `<div class="cl-cat-btn ${ui.catKey===c.key?'active':''}" id="cl-cat-${c.key}" onclick="clSetCat('${c.key}')" title="${c.label}">${c.icon}</div>`).join('')}
          </div>
        </div>
        <div class="cl-field">
          <label>誰付的錢</label>
          <div class="cl-toggle-row">
            <div class="cl-toggle-btn a ${ui.paidBy==='a'?'active':''}" id="cl-paidby-a" onclick="clSetPaidBy('a')"><span class="cl-dot" style="background:var(--accent-a)"></span>${escapeHtml(nameA)}</div>
            <div class="cl-toggle-btn b ${ui.paidBy==='b'?'active':''}" id="cl-paidby-b" onclick="clSetPaidBy('b')"><span class="cl-dot" style="background:var(--accent-b)"></span>${escapeHtml(nameB)}</div>
          </div>
        </div>
        <div class="cl-field">
          <label>怎麼分</label>
          <div class="cl-split-mode">
            <button id="cl-splitmode-equal" class="${ui.splitMode==='equal'?'active':''}" onclick="clSetSplitMode('equal')">平分</button>
            <button id="cl-splitmode-advance" class="${ui.splitMode==='advance'?'active':''}" onclick="clSetSplitMode('advance')">墊付</button>
          </div>
          <div class="cl-advance-note" id="cl-advance-note" style="display:${ui.splitMode === 'advance' ? '' : 'none'}">
            ${advanceNoteHtml(nameA, nameB, ui.paidBy)}
          </div>
        </div>
        <button class="cl-submit-btn" onclick="clAddExpense()">加入帳本</button>
      </div>

      <div class="cl-ledger">
        <div class="cl-ledger-head">
          <h2>支出紀錄</h2>
          <div class="cl-ledger-total">共 NT$ ${fmt(total)}</div>
        </div>
        ${listHtml}
        ${historyHtml}
      </div>

      <div class="cl-footer">
        <button onclick="clOpenModal('reset')">清除所有資料</button>
      </div>

      ${renderModal(nameA, nameB, bal)}
    `;

    // restore focus / cursor / scroll after the DOM swap
    if (activeId){
      const el = document.getElementById(activeId);
      if (el){
        el.focus();
        if (selStart !== null && el.setSelectionRange){
          try { el.setSelectionRange(selStart, selEnd); } catch(e){}
        }
      }
    }
    window.scrollTo(0, scrollY);
  }

  function renderModal(nameA, nameB, bal){
    if (!ui.modal) return '';

    if (ui.modal === 'settings'){
      return `
        <div class="cl-modal-overlay" onclick="clCloseModalBg(event)">
          <div class="cl-modal" onclick="event.stopPropagation()">
            <h3>編輯兩人的名字</h3>
            <div class="cl-field">
              <label>對方 A（琥珀色）</label>
              <input class="cl-input" id="cl-name-a" value="${escapeHtml(nameA)}" />
            </div>
            <div class="cl-field">
              <label>對方 B（青色）</label>
              <input class="cl-input" id="cl-name-b" value="${escapeHtml(nameB)}" />
            </div>
            <div class="cl-modal-close-row">
              <button class="cl-modal-btn" onclick="clCloseModal()">取消</button>
              <button class="cl-modal-btn primary" onclick="clSaveNames()">儲存</button>
            </div>
          </div>
        </div>`;
    }

    if (ui.modal === 'settle'){
      const who = bal > 0 ? nameB : nameA;
      const whom = bal > 0 ? nameA : nameB;
      return `
        <div class="cl-modal-overlay" onclick="clCloseModalBg(event)">
          <div class="cl-modal" onclick="event.stopPropagation()">
            <h3>結清帳目</h3>
            <p style="color:var(--text-muted); font-size:13.5px; margin:-8px 0 16px;">
              ${escapeHtml(who)} 付給 ${escapeHtml(whom)} NT$ ${fmt(Math.abs(bal))}，結清後餘額歸零。
            </p>
            <div class="cl-modal-close-row">
              <button class="cl-modal-btn" onclick="clCloseModal()">取消</button>
              <button class="cl-modal-btn primary" onclick="clSettleUp()">確認已付款</button>
            </div>
          </div>
        </div>`;
    }

    if (ui.modal === 'history'){
      const items = [...state.settlements].sort((x,y)=>y.createdAt-x.createdAt);
      const rows = items.map(s => `
        <div class="cl-history-item">
          <span>${escapeHtml(s.from === 'a' ? nameA : nameB)} → ${escapeHtml(s.from === 'a' ? nameB : nameA)} · ${s.date}</span>
          <span>NT$ ${fmt(s.amount)}</span>
        </div>`).join('') || '<div class="cl-empty"><p>還沒有結清紀錄</p></div>';
      return `
        <div class="cl-modal-overlay" onclick="clCloseModalBg(event)">
          <div class="cl-modal" onclick="event.stopPropagation()">
            <h3>結清紀錄</h3>
            <div class="cl-history-list">${rows}</div>
            <div class="cl-modal-close-row">
              <button class="cl-modal-btn primary" onclick="clCloseModal()">關閉</button>
            </div>
          </div>
        </div>`;
    }

    if (ui.modal === 'reset'){
      return `
        <div class="cl-modal-overlay" onclick="clCloseModalBg(event)">
          <div class="cl-modal" onclick="event.stopPropagation()">
            <h3>清除所有資料？</h3>
            <p style="color:var(--text-muted); font-size:13.5px; margin:-8px 0 16px;">
              這會刪除所有支出與結清紀錄，且無法復原。
            </p>
            <div class="cl-modal-close-row">
              <button class="cl-modal-btn" onclick="clCloseModal()">取消</button>
              <button class="cl-modal-btn primary" style="background:var(--danger)" onclick="clResetAll()">確定清除</button>
            </div>
          </div>
        </div>`;
    }
    return '';
  }

  // ---------- handlers (exposed on window) ----------
  window.clSetDesc = (v) => { ui.desc = v; };
  window.clSetAmount = (v) => { ui.amount = v; };

  window.clSetCat = (k) => {
    if (ui.catKey === k) return;
    const prevEl = document.getElementById('cl-cat-' + ui.catKey);
    if (prevEl) prevEl.classList.remove('active');
    ui.catKey = k;
    const nextEl = document.getElementById('cl-cat-' + k);
    if (nextEl) nextEl.classList.add('active');
  };

  window.clSetPaidBy = (p) => {
    if (ui.paidBy === p) return;
    const prevEl = document.getElementById('cl-paidby-' + ui.paidBy);
    if (prevEl) prevEl.classList.remove('active');
    ui.paidBy = p;
    const nextEl = document.getElementById('cl-paidby-' + p);
    if (nextEl) nextEl.classList.add('active');
    // if in advance mode, who owes whom depends on who paid — keep it in sync
    if (ui.splitMode === 'advance'){
      ui.splitA = computeAdvanceSplitA(p);
      const note = document.getElementById('cl-advance-note');
      if (note) note.innerHTML = advanceNoteHtml(state.partners.a.name, state.partners.b.name, p);
    }
  };

  window.clSetSplitMode = (m) => {
    if (ui.splitMode === m) return;
    document.getElementById('cl-splitmode-' + ui.splitMode).classList.remove('active');
    ui.splitMode = m;
    ui.splitA = m === 'equal' ? 50 : computeAdvanceSplitA(ui.paidBy);
    document.getElementById('cl-splitmode-' + m).classList.add('active');
    const note = document.getElementById('cl-advance-note');
    if (note){
      note.style.display = m === 'advance' ? '' : 'none';
      note.innerHTML = advanceNoteHtml(state.partners.a.name, state.partners.b.name, ui.paidBy);
    }
  };

  window.clAddExpense = async () => {
    const desc = (ui.desc || '').trim();
    const amount = parseFloat(ui.amount);
    if (!amount || amount <= 0){
      const amountEl = document.getElementById('cl-amount');
      if (amountEl){
        amountEl.focus();
        amountEl.style.borderColor = 'var(--danger)';
        setTimeout(()=>{ amountEl.style.borderColor = ''; }, 900);
      }
      return;
    }
    const today = new Date();
    const dateStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    state.expenses.push({
      id: uid(),
      desc, amount,
      cat: ui.catKey,
      paidBy: ui.paidBy,
      mode: ui.splitMode,
      splitA: ui.splitMode === 'equal' ? 50 : computeAdvanceSplitA(ui.paidBy),
      date: dateStr,
      createdAt: Date.now()
    });
    ui.desc = ''; ui.amount = ''; ui.catKey = 'other'; ui.splitMode = 'equal'; ui.splitA = 50;
    await saveData();
    render();
  };

  window.clDeleteExpense = async (id) => {
    state.expenses = state.expenses.filter(e => e.id !== id);
    await saveData();
    render();
  };

  window.clOpenModal = (name) => { ui.modal = name; render(); };
  window.clCloseModal = () => { ui.modal = null; render(); };
  window.clCloseModalBg = (e) => { if (e.target === e.currentTarget) window.clCloseModal(); };

  window.clSaveNames = async () => {
    const a = document.getElementById('cl-name-a').value.trim();
    const b = document.getElementById('cl-name-b').value.trim();
    if (a) state.partners.a.name = a;
    if (b) state.partners.b.name = b;
    ui.modal = null;
    await saveData();
    render();
  };

  window.clSettleUp = async () => {
    const bal = computeBalance();
    if (Math.abs(bal) >= 1){
      const today = new Date();
      const dateStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
      state.settlements.push({
        id: uid(),
        from: bal > 0 ? 'b' : 'a',
        amount: Math.abs(bal),
        date: dateStr,
        createdAt: Date.now()
      });
    }
    ui.modal = null;
    await saveData();
    render();
  };

  window.clResetAll = async () => {
    state = defaultData();
    ui.modal = null;
    await saveData();
    render();
  };

  startListening();
})();
</script>
